[package]
name = "metaservice-agent"
version = "0.1.0"
edition = "2021"
description = "MetaService Agent for Windows: joins the parent over WireGuard, reports stats, opens a host terminal. VMs are not part of the Windows helper yet."
license = "MIT"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "fs", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk"] }
ureq = { version = "2", default-features = false }
regex = "1"
rand = "0.8"
flate2 = "1"
tar = "0.4"
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
