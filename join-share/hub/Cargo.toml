[package]
name = "join-share-hub"
version = "0.1.0"
edition = "2021"
description = "MetaService join-share hub: WireGuard network and join flow for far PCs"
license = "MIT"

[lib]
name = "join_share_hub"
path = "src/lib.rs"

[[bin]]
name = "join-share"
path = "src/bin/join-share.rs"

[[bin]]
name = "join-share-root"
path = "src/bin/join-share-root.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# In-process HTTP tests: drive the router without a socket.
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
