openapi: 3.0.3
info:
  title: MetaService Root-Agent contract
  version: 1.3.0
  description: >
    The one API every MetaService Agent implements, and the part of the Root that Agents call.
    An Agent that passes contract/tests works with the Root, whatever language it is written in.
    JSON only. Every request carries a Bearer token: the Agent's command token when the Root calls an Agent,
    the machine token when an Agent calls the Root (heartbeat). Each side keeps the other's token secret.
    Every response carries the header X-MetaService-Contract with the contract version.
servers:
  - url: http://127.0.0.1:9101
security:
  - machineToken: []
paths:
  /v1/health:
    get:
      summary: Is the Agent alive, and which versions does it run
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/facts:
    get:
      summary: What this machine is and how much room it has
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Facts' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/stats:
    get:
      summary: >
        The machine's real state now (read only): CPU total and per core, load, memory, disks, network speed, GPU (key left out when the system cannot say), uptime, top 15 processes
        (program name and user only, never a command line). The helper computes percentages between its own samples; the first answer after a start has measuring true and null rates.
        Optional, added without a version change (a helper without it answers 404). Exact rules: docs/monitor-contract.md.
        The optional query `processes` (`1` or `0`, absent means `1`) was added later without a version change: `0` skips the scan of programs and the answer has `processes: []`;
        a helper that does not know it ignores it and sends the list. Any other value is a 400 (code invalid_input).
      parameters:
        - { $ref: '#/components/parameters/ProcessesQuery' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/images:
    get:
      summary: >
        Which ready-made images this machine has prepared (read only). Optional, added without a version change (a helper without it answers 404, and the Root then treats the machine as
        having only the stock `blank` image). Only catalog ids are named; `blank` is the stock image and is always listed ready. `built_at` is null for it.
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/HelperImages' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/workloads:
    get:
      summary: Local VMs and containers
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/WorkloadList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a workload (runs the local space check first)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkloadCreate' } } }
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: not enough room or capability, content: { application/json: { schema: { $ref: '#/components/schemas/Refusal' } } } }
        '413': { $ref: '#/components/responses/TooLarge' }
  /v1/workloads/{id}/start:
    post:
      summary: Start a workload
      parameters: [ { $ref: '#/components/parameters/WorkloadId' }, { $ref: '#/components/parameters/CommandIdHeader' } ]
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/workloads/{id}/stop:
    post:
      summary: Stop a workload
      parameters: [ { $ref: '#/components/parameters/WorkloadId' }, { $ref: '#/components/parameters/CommandIdHeader' } ]
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/workloads/{id}:
    delete:
      summary: Delete a workload. The Agent backs up its disk first.
      parameters: [ { $ref: '#/components/parameters/WorkloadId' }, { $ref: '#/components/parameters/CommandIdHeader' } ]
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/workloads/{id}/terminal:
    get:
      summary: >
        A console in a running workload, as a WebSocket (RFC 6455). Frames: binary from the client are keystrokes and paste (at most 65536 bytes);
        a text frame {"resize":[cols,rows]} sets the window size (cols 1..500, rows 1..300; the start size is 80x24); binary from the server is terminal output.
        Anything else, or an oversized frame, closes the socket with code 1008. The shell ending, the workload stopping or being deleted closes it with 1000 and a short plain reason.
        The helper runs the engine's own "run a program inside the workload" in a pty and kills it when the socket closes. At most 1 console per workload.
        Without an Upgrade header the route runs the same checks and answers 426 when all pass (a preflight for exact statuses; a refused upgrade itself may be any non-101 answer).
      parameters: [ { $ref: '#/components/parameters/WorkloadId' } ]
      responses:
        '101': { description: switching protocols to WebSocket }
        '426': { description: upgrade required (preflight without upgrade headers; every check passed) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'the workload is not running (code not_running), already has a console (code console_open), or is a VM without the incus guest agent so it cannot be entered (code no_agent, with a plain reason)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/workloads/{id}/gpu-check:
    post:
      summary: >
        A read-only look, from inside a running container, at whether the GPU got there. Optional, added without a version change (a helper without it answers 404). Empty body; the workload id is the only input.
        The helper asks, inside the container and with fixed commands only: first `nvidia-smi` (when the program exists there), then the NVIDIA device files (/dev/nvidia*) and /proc/driver/nvidia/version, then nothing,
        and says which one answered (`how`). It never assumes nvidia-smi exists in the image. A VM, or a container whose gpu_mode is not container, is answered without running anything inside it:
        gpu_visible false and a note that no GPU was given. The text in `detail` comes from inside the workload: untrusted, cut to a few short printable lines.
      parameters: [ { $ref: '#/components/parameters/WorkloadId' } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/GpuCheck' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'the container is not running (code not_running)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/workloads/{id}/ssh-keys:
    put:
      summary: >
        Sets the complete list of SSH public keys that may log in as root of ONE VM. Optional, added without a version change (a helper without it answers 404, and the Root then shows the keys as not applied).
        Idempotent full-state apply: the list in the body is exactly what must be in the VM's /root/.ssh/authorized_keys afterwards, an empty list removes every key the helper manages, and sending the same list again changes nothing.
        The helper replaces the whole of root's authorized_keys inside that VM with exactly this list (a key added by hand inside the VM is removed on the next apply); it never touches the host machine's own authorized_keys, and it never adds a key of its own or the Root's key.
        Each line is `type base64 [comment]` and the Root has already validated it; the helper still refuses a body with a line that is not exactly one such line (400) and writes nothing in that case. Key bodies are never logged.
        The VM must be running (409 not_running). `applied` is the number of keys now in the VM. `sshd` says what the helper found or did about the SSH server in the VM:
        `running` (listening), `installed` (the server is there but not running, and the helper could not start it), `missing` (there is none and the helper could not add one).
      parameters: [ { $ref: '#/components/parameters/WorkloadId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SshKeysApply' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SshKeysApplied' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'the VM is not running (code not_running)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'install_sshd was true and the SSH server could not be made to listen (code sshd_install_failed, plain-words message); the keys are still written', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/workloads/{id}/app:
    put:
      summary: >
        Installs an app (OpenClaw or Hermes) inside ONE running VM, with constant installer scripts that download the vendor's official installer. Optional, added without a version change
        (a helper without it answers 404 or 400, and the Root then shows the app as failed with "update the helper"). Helpers that have it say `ready: true` for `openclaw` and `hermes` in GET /v1/images.
        Idempotent: `installed` is false when the app was there already and nothing changed. The body holds exactly one field, `app`; an unknown field or value is a 400 invalid_input.
        The VM must be running (409 not_running). A long call (up to 25 minutes; the Root waits that long). `version` and `installer_sha256` (lowercase hex SHA-256 of the installer script that ran) are null when unknown.
        A failed install is a 502 `app_install_failed` with a plain-words message and `log_tail`: at most 12 strings of at most 200 characters, the last lines the installer printed (plain text, no secrets). Nothing else is returned.
      parameters: [ { $ref: '#/components/parameters/WorkloadId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppInstall' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AppInstalled' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'the VM is not running (code not_running)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'the installer failed (code app_install_failed)', content: { application/json: { schema: { $ref: '#/components/schemas/AppInstallError' } } } }
  /v1/bundle/install:
    post:
      summary: Install or upgrade the chat bundle on the machine or in a workload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BundleInstall' } } }
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/bundle/uninstall:
    post:
      summary: Turn the chat off on the machine or in a workload. It stops; the folder with its conversations stays, so installing again brings them back.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BundleUninstall' } } }
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/commands/{id}:
    get:
      summary: Status and result of a long command
      parameters: [ { $ref: '#/components/parameters/CommandId' } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Command' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sandboxes:
    get:
      summary: >
        The sandboxes on this machine that are not gone (starting, running, pausing, paused, resuming, stopping). Optional, added without a version change:
        a helper without these routes answers 404 and says nothing about sandboxes in its facts, so the Root places none on that machine. See sandbox/README.md.
        Sandboxes are not workloads: they are short-lived, many, and made by programs, so they have their own routes, their own list and their own events.
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SandboxList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: >
        Make a sandbox from a template and answer once it is ready (its in-guest daemon answers), within 30 seconds. Synchronous, unlike workloads: a sandbox
        is meant to start in well under a second. The Root picks the id, so a retry with the same id and the same body answers the same sandbox (200) and never
        makes a second one; the same id with a different body is a 409 `id_taken`. A create that does not get ready in time is removed again, leaving nothing
        behind, and answers 504 `start_timeout` with the last lines the sandbox printed.
        `access_token` is secret: it goes to the daemon inside and is never logged, returned or stored.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SandboxCreate' } } }
      responses:
        '200': { description: 'the same id and body were sent before; this is that sandbox', content: { application/json: { schema: { $ref: '#/components/schemas/Sandbox' } } } }
        '201': { description: made and ready, content: { application/json: { schema: { $ref: '#/components/schemas/Sandbox' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 'no room (`not_enough_room`), `template_not_ready`, or `id_taken`', content: { application/json: { schema: { $ref: '#/components/schemas/SandboxRefusal' } } } }
        '504': { description: 'it did not get ready in 30 seconds (`start_timeout`); it was removed', content: { application/json: { schema: { $ref: '#/components/schemas/SandboxStartFailure' } } } }
  /v1/sandboxes/{id}:
    parameters: [ { $ref: '#/components/parameters/SandboxId' } ]
    get:
      summary: One sandbox
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Sandbox' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: >
        Stop the sandbox and remove everything it had (its process, disk, snapshot, network). Idempotent: a sandbox that is already gone answers 204 too.
        A sandbox this helper never had is a 404. The `ended` event carries its final running time.
      responses:
        '204': { description: gone }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sandboxes/{id}/end:
    parameters: [ { $ref: '#/components/parameters/SandboxId' } ]
    put:
      summary: >
        Change when the sandbox ends and what happens then. The helper keeps this itself and acts on it even when the Root cannot be reached, so a sandbox
        never outlives its time because the parent was down. POST to this same path answers the same thing, for callers that send it; the Root sends PUT.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SandboxEnd' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Sandbox' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sandboxes/{id}/metrics:
    parameters: [ { $ref: '#/components/parameters/SandboxId' } ]
    get:
      summary: CPU, memory and disk readings of one sandbox, one every 5 seconds while it runs, the last hour at most
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SandboxMetrics' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sandboxes/{id}/pause:
    parameters: [ { $ref: '#/components/parameters/SandboxId' } ]
    put:
      summary: >
        Pause the sandbox where it is, memory and all: its programs stop, it uses no CPU and no memory, and `resume` carries on from the same place. This
        is the helper's own Firecracker API (`PATCH /vm {"state":"Paused"}` through the sandbox's socket). Its end time does not move: a paused sandbox is
        still the helper's to end, and it is removed at that time unless a resume comes first. A second pause answers the same sandbox, unchanged.
      responses:
        '200': { description: paused, content: { application/json: { schema: { $ref: '#/components/schemas/Sandbox' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'this helper''s engine cannot pause a sandbox (`not_pausable`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/sandboxes/{id}/resume:
    parameters: [ { $ref: '#/components/parameters/SandboxId' } ]
    put:
      summary: >
        Carry on from where a paused sandbox stopped, on the same machine and from the same memory: `PATCH /vm {"state":"Resumed"}` through its Firecracker
        API. The time it spent paused is not counted as running time, and its end time is the one it already had. A resume of one that is running answers
        the same sandbox, unchanged.
      responses:
        '200': { description: running again, content: { application/json: { schema: { $ref: '#/components/schemas/Sandbox' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'this helper''s engine cannot resume a sandbox (`not_pausable`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/sandboxes/{id}/ports/{port}/{path}:
    parameters:
      - { $ref: '#/components/parameters/SandboxId' }
      - { $ref: '#/components/parameters/SandboxPort' }
      - { $ref: '#/components/parameters/SandboxPath' }
    # This is the one route whose command token is not `Authorization`: the caller's own `Authorization` must reach the program
    # inside the sandbox, so the helper's token travels in `X-MetaService-Token`. Every other route keeps the bearer token.
    security:
      - portToken: []
    get:
      summary: >
        The way into a sandbox: the request goes to `port` inside it and both directions are streamed, with no size limit and no buffering. This is how the
        in-guest daemon's commands and files and the sandbox's own web servers are reached (see sandbox/README.md). An unknown, paused or ended sandbox, or a
        closed port inside, is a 502 with a code, because E2B's SDKs read a 502 from the daemon's `/health` as "not running"; the Root passes it on as it is.
        A helper that has no way into a sandbox yet (its engine serves no ports) answers 501 `no_port_proxy` with a plain reason, and the Root shows that as
        the machine not being ready rather than an empty page. On port 49983 a helper refuses the in-guest daemon's own internal routes (403 `internal_route`).
      responses:
        '101': { description: WebSocket upgraded by the program inside }
        '200': { description: whatever the program inside answers (any status) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: one of the daemon''s internal routes (`internal_route`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '501': { description: this helper cannot pass a request into a sandbox yet (`no_port_proxy`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'no such sandbox (`not_found`), it is paused (`paused`) or ended (`ended`), or nothing listens on that port inside (`port_closed`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: Same as GET; so are PUT, PATCH and DELETE, since a program inside may take any of them.
      responses:
        '101': { description: WebSocket upgraded by the program inside }
        '200': { description: whatever the program inside answers (any status) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: one of the daemon''s internal routes (`internal_route`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '501': { description: this helper cannot pass a request into a sandbox yet (`no_port_proxy`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'no such sandbox (`not_found`), it is paused (`paused`) or ended (`ended`), or nothing listens on that port inside (`port_closed`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/sandbox-events:
    get:
      summary: >
        What happened to sandboxes on this machine, in order, after change number `after`. The Root reads it whenever `Facts.sandbox.changes` moved, so it
        learns of sandboxes the helper ended by itself (timeout, out of memory, crash) and of the exact running time to count. Kept for 24 hours or the last
        10,000 events. When `after` is older than that, the answer is 410 `too_old` and the Root reads the full list instead (`after=0`).
      parameters:
        - { name: after, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SandboxEvents' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { description: events before this are no longer kept (`too_old`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/sandbox-templates:
    get:
      summary: The templates this machine has built or is building (building a template is a later slice; `PUT` and `DELETE` on one come with it).
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SandboxTemplateList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents/enroll:
    post:
      summary: Root endpoint. Exchange a one-time enrollment token for a permanent machine token.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollResponse' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents/heartbeat:
    post:
      summary: Root endpoint. Facts and workload states, every 15 seconds.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Heartbeat' } } }
      responses:
        '204': { description: recorded }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/machines/{machine}/workloads/{workload}/terminal:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie, Host, Origin and CSRF checked like every operator write) } ]
    post:
      summary: Root endpoint for the panel. Ask for a one-time ticket to open a console in a running VM. Empty body. The ticket is single use, bound to the operator, valid 30 seconds.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/WorkloadId' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalTicket' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Origin, Host or CSRF token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine or VM (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'the VM is not running (code not_running), the helper of the machine does not say `terminal` in its capabilities and the machine is not a Mac (code not_supported, "Update the helper on this machine to use the terminal."), or it already has a console (code console_open)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: '4 consoles are open in total (code too_many_consoles)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'the machine is offline (code unreachable)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/workloads/{workload}/gpu-check:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie, Host, Origin and CSRF checked like every operator write) } ]
    post:
      summary: >
        Root endpoint for the panel. Asks the machine's helper to look inside one workload for the GPU (see /v1/workloads/{id}/gpu-check) and passes its answer on after applying the limits again.
        Empty body. At most 1 check per workload every 5 seconds (429 rate_limited), and the helper gets 20 seconds to answer. Optional, added without a version change.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/WorkloadId' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/GpuCheck' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Origin, Host or CSRF token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine or workload (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'the workload is not running (code not_running), or the helper is too old to check (code not_supported)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'checked again too soon (code rate_limited)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'the machine is offline or did not answer in time (code unreachable)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/workloads/{workload}/ssh-keys:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie, Host, Origin and CSRF checked like every operator write) } ]
    get:
      summary: >
        Root endpoint for the panel. The SSH public keys given for one VM (type, SHA-256 fingerprint and comment; never the key itself), whether the machine's helper has the current list (`applied`),
        and what the helper last said about the VM's SSH server (`sshd`: running, installed, missing, or unknown when it never said). Optional, added without a version change. At most 120 reads a minute.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/WorkloadId' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SshKeysView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Host', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine or VM (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'too many requests (code rate_limited)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: >
        Root endpoint for the panel (operator write: session, Host, Origin and CSRF checked). Adds one SSH public key to a VM; the user can then log in as root of that VM only. Body { "public_key": "ssh-ed25519 AAAA... comment" }.
        The Root checks the key strictly and refuses, in plain words (code invalid_input), anything that is not exactly one line `type base64 [comment]`: key options (command=, from=, restrict ...), a line break or control character, a type other than
        ssh-ed25519, ecdsa-sha2-nistp256/384/521, ssh-rsa or sk-ssh-ed25519@openssh.com, a key whose bytes do not match its type, an RSA key under 2048 bits, a comment with other characters than letters, digits and . _ @ + : - or over 64 characters, more than 800 characters in all. Nothing is cleaned up silently.
        At most 20 keys per VM. If the VM is running the Root sends the full list to the helper at once; if the VM is stopped, or the helper cannot be reached or says no, the key is still stored and `applied` is false, and the Root applies it by itself
        with a heartbeat that shows the VM running. At most 30 changes a minute.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/WorkloadId' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SshKeyAdd' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/SshKeysView' } } } }
        '400': { description: 'the key is not acceptable (code invalid_input, message in plain words)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Origin, Host or CSRF token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine or VM (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'this key is already on the VM (code duplicate_key), or the VM has 20 keys (code too_many_keys)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'too many requests (code rate_limited)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/workloads/{workload}/ssh-keys/{key}:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie, Host, Origin and CSRF checked like every operator write) } ]
    delete:
      summary: Root endpoint for the panel (operator write). Removes one key from a VM and applies the new list the same way as adding does. Answers the same shape as the list.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/WorkloadId' }
        - { name: key, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SshKeysView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Origin, Host or CSRF token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine, VM or key (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'too many requests (code rate_limited)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/workloads/{workload}/ssh-keys/retry:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie, Host, Origin and CSRF checked like every operator write) } ]
    post:
      summary: Root endpoint for the panel (operator write). Applies the keys and sets up the SSH server now, without waiting for the heartbeat or the minute after a failure. Answers the same shape as the list, normally with sshd_state installing. 409 not_running when the VM is stopped.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/WorkloadId' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SshKeysView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Origin, Host or CSRF token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine or VM (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'the VM is not running (code not_running)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'too many requests (code rate_limited)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/workloads/{workload}/app:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie and Host checked like every operator read) } ]
    get:
      summary: >
        Root endpoint for the panel (operator read). The app wanted inside one VM and how setting it up stands. `state` is none (no app wanted, or wanted and not started yet), installing, ready or failed.
        An install older than 30 minutes is read as failed ("Setting up the app did not finish. The parent may have restarted. Try again."). `log_tail` is plain text, to be shown as text only.
        The machine list (GET /api/machines) carries the same on each workload as `app`: { name, state, message } or null.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/WorkloadId' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AppView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Host', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine or VM (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'too many requests (code rate_limited)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/workloads/{workload}/app/retry:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie, Host, Origin and CSRF checked like every operator write) } ]
    post:
      summary: Root endpoint for the panel (operator write). Starts the install now, without waiting for the heartbeat or the minute after a failure. Answers the same shape as the read, with state installing. 409 not_running when the VM is stopped, 409 no_app when the VM has no app wanted.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/WorkloadId' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AppView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Origin, Host or CSRF token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine or VM (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'the VM is not running (code not_running) or has no app wanted (code no_app)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'too many requests (code rate_limited)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/update-helper:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie, Host, Origin and CSRF checked like every operator write) } ]
    post:
      summary: >
        Root endpoint for the panel. Replaces the helper program on one machine with the newest one the parent has for that kind of computer, in ONE SSH login with a fixed script: it
        receives the program, checks its SHA-256, keeps the old program as `bin/metaservice-agent.before-<8 hex>`, stops the helper, puts the new program in, starts it, waits about 8 seconds and
        checks that it answers; if it does not, the old program is put back and started again (`rolled_back`). The helper's `state/` folder is never touched. Empty body. At most 2 a minute
        per machine (429 rate_limited). Optional, added without a version change.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'the end of the update (`updated`, `rolled_back` or `failed`) with a sentence in plain words', content: { application/json: { schema: { $ref: '#/components/schemas/HelperUpdateResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Origin, Host or CSRF token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'login_needed (the parent cannot log in to that computer with its key any more), no_build (the parent has no program for that system), up_to_date, or machine_busy (a VM is being made or deleted there, or an update is already running)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'updated twice in the last minute (code rate_limited)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'the computer cannot be reached, or it showed a different SSH host key than the one pinned', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/images:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie and Host checked like every operator read) } ]
    get:
      summary: >
        Root endpoint for the panel. The parent's catalog of ready-made images: id, title, description, state (`ready` can be chosen, `planned` is listed but cannot yet) and a one-line reason
        for a planned one. Pinned versions and checksums never leave the parent. Optional, added without a version change.
      security: []
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ImageCatalog' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: wrong Host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/images:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie and Host checked like every operator read) } ]
    get:
      summary: >
        Root endpoint for the panel. The catalog joined with what this machine has prepared: each entry has `ready` (prepared on the machine), `available` (can be chosen now: the catalog says
        `ready` and the machine has it) and `reason`. `helper` says who answered: `answered`, `old_helper` (the helper has no /v1/images, only `blank`) or `unreachable` (offline, or an answer that could
        not be read; only `blank`). `blank` is ready and available on every machine. Optional, added without a version change.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/MachineImages' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: wrong Host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: no such machine (code not_found), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/stats:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie and Host checked like every operator read) } ]
    get:
      summary: >
        Root endpoint for the panel. The machine's latest reading. The Root keeps one shared reading per machine (the helper is called at most once per 4 seconds however many tabs ask,
        and the reading is dropped after 30 seconds without a request) and applies the limits again before passing it on. An offline machine answers 200 with state offline and the last reading, or null; a helper that has no stats route (an older helper) answers state old_helper with stats null.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/ProcessesQuery' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/MachineStatsReply' } } } }
        '400': { description: 'processes is not 1 or 0 (code invalid_input)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: wrong Host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: no such machine (code not_found), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/stats/history:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie and Host checked like every operator read) } ]
    get:
      summary: >
        Root endpoint for the panel. The last hour of readings the parent took of this machine, oldest first, one about every 10 seconds, so a chart is full the moment the page opens.
        Kept in the parent's memory only: it is lost when the parent restarts and never written to the database. Only online machines are sampled (through the same shared reading as the stats route,
        without the process list); an offline machine keeps what it had. At most 256 machines and 360 points each. Gaps (a failed or still measuring reading) are simply missing.
        Optional, added without a version change.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { name: points, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 360, default: 360 }, description: 'How many of the newest points; plain digits only, anything else is a 400 (code invalid_input).' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/MachineStatsHistory' } } } }
        '400': { description: 'points is not a whole number from 1 to 360 (code invalid_input)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: wrong Host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: no such machine (code not_found), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/terminal/{ticket}:
    servers: [ { url: 'https://panel.example', description: the Root operator listener } ]
    get:
      summary: >
        Root endpoint for the panel. Upgrades to a WebSocket that carries the console frames (see /v1/workloads/{id}/terminal; the Root passes them through unchanged
        and never reads the content). Checks in this order: session cookie, Origin equals the panel's own origin, ticket valid and made by this operator.
        Any failure refuses the upgrade with a plain HTTP reply (401, 403, 404 or a bare 400) and never opens a socket. Idle for 15 minutes or 8 hours in total closes it with 1000;
        the machine going offline closes it with 1011 "the machine is offline". The audit log gets console_open and console_close (machine, VM, operator, seconds), never keystrokes or output.
      security: []
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: string, minLength: 32 } }
      responses:
        '101': { description: switching protocols to WebSocket }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: wrong Origin or operator, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    machineToken: { type: http, scheme: bearer }
    # The one route that does not use `machineToken`: the sandbox port route takes the command token here instead, so the caller's
    # own `Authorization` header reaches the program inside the sandbox untouched (see sandbox/helper.yaml).
    portToken: { type: apiKey, in: header, name: X-MetaService-Token }
  parameters:
    ProcessesQuery:
      name: processes
      in: query
      required: false
      description: '1 (also when absent) includes the top programs, 0 leaves them out and spares the machine the scan. The Root keeps one shared reading per machine: a reading with the list also answers a request without it; a request with the list after one without makes one more helper call. Nothing the caller typed is passed on to a helper.'
      schema: { type: string, enum: ['0', '1'] }
    CommandIdHeader:
      name: X-Command-Id
      in: header
      required: false
      description: Makes a retry safe. The same id never runs twice. The Agent makes one up when it is missing.
      schema: { $ref: '#/components/schemas/Id' }
    WorkloadId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CommandId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SandboxId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SandboxId' }
    SandboxPort:
      name: port
      in: path
      required: true
      description: The port inside the sandbox the request goes to.
      schema: { type: integer, minimum: 1, maximum: 65535 }
    SandboxPath:
      name: path
      in: path
      required: true
      description: The rest of the URL, slashes and query included, sent on to the program unchanged.
      schema: { type: string }
  responses:
    Unauthorized: { description: missing or wrong token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Invalid: { description: input failed validation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: no such thing, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooLarge: { description: request body too large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Id:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    Name:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    Pct:
      type: number
      minimum: 0
      maximum: 100
    PctOrNull:
      type: number
      nullable: true
      minimum: 0
      maximum: 100
    Bytes:
      type: integer
      minimum: 0
    Stats:
      type: object
      required: [taken_at, measuring, uptime_seconds, cpu, memory, disks, network, processes]
      additionalProperties: false
      properties:
        taken_at: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' }
        measuring: { type: boolean }
        uptime_seconds: { type: integer, minimum: 0 }
        cpu:
          type: object
          required: [core_count, total_percent, cores_percent, load]
          additionalProperties: false
          properties:
            core_count: { type: integer, minimum: 1, maximum: 1024 }
            total_percent: { $ref: '#/components/schemas/PctOrNull' }
            cores_percent:
              type: array
              nullable: true
              maxItems: 1024
              items: { $ref: '#/components/schemas/Pct' }
            load:
              type: object
              required: [one, five, fifteen]
              additionalProperties: false
              properties:
                one: { type: number, nullable: true, minimum: 0 }
                five: { type: number, nullable: true, minimum: 0 }
                fifteen: { type: number, nullable: true, minimum: 0 }
            physical_cores: { type: integer, minimum: 1, maximum: 1024, description: 'Optional. Physical cores; core_count is the logical CPUs (threads).' }
            core_of:
              type: array
              maxItems: 1024
              items: { type: integer, minimum: 0, maximum: 1023 }
              description: 'Optional. For each logical CPU (same order as cores_percent) the index of its physical core, so the threads of one core can be grouped.'
            clusters:
              type: array
              minItems: 1
              maxItems: 8
              description: 'Optional. Groups of logical CPUs the system names (Apple Silicon: Performance, Efficiency). Left out on Linux.'
              items:
                type: object
                required: [name, logical]
                additionalProperties: false
                properties:
                  name: { type: string, maxLength: 64 }
                  logical: { type: integer, minimum: 1, maximum: 1024 }
            breakdown:
              type: object
              nullable: true
              additionalProperties: false
              description: 'Optional. Share of the last interval in each CPU state, percent. Linux gives all eight; a Mac gives user, system, nice, idle only (the others are left out, never 0). Null while measuring.'
              properties:
                user: { $ref: '#/components/schemas/Pct' }
                system: { $ref: '#/components/schemas/Pct' }
                nice: { $ref: '#/components/schemas/Pct' }
                idle: { $ref: '#/components/schemas/Pct' }
                iowait: { $ref: '#/components/schemas/Pct' }
                irq: { $ref: '#/components/schemas/Pct' }
                softirq: { $ref: '#/components/schemas/Pct' }
                steal: { $ref: '#/components/schemas/Pct' }
            frequency_mhz:
              type: object
              required: [average, max]
              additionalProperties: false
              description: 'Optional. Linux only (cpufreq). Left out when the system does not say; never 0.'
              properties:
                average: { type: number, exclusiveMinimum: 0, maximum: 20000 }
                max: { type: number, exclusiveMinimum: 0, maximum: 20000 }
            temperature_celsius: { type: number, minimum: 1, maximum: 150, description: 'Optional. Linux only (hwmon or thermal zone). A Mac gives it only to root, so it is left out.' }
        memory:
          type: object
          required: [total_bytes, used_bytes, cached_bytes, free_bytes, swap_total_bytes, swap_used_bytes]
          additionalProperties: false
          properties:
            total_bytes: { $ref: '#/components/schemas/Bytes' }
            used_bytes: { $ref: '#/components/schemas/Bytes' }
            cached_bytes: { $ref: '#/components/schemas/Bytes' }
            free_bytes: { $ref: '#/components/schemas/Bytes' }
            swap_total_bytes: { $ref: '#/components/schemas/Bytes' }
            swap_used_bytes: { $ref: '#/components/schemas/Bytes' }
        disks:
          type: array
          maxItems: 16
          items:
            type: object
            required: [mount, name, fs, total_bytes, used_bytes, free_bytes]
            additionalProperties: false
            properties:
              mount: { type: string, maxLength: 128 }
              name: { type: string, maxLength: 64 }
              fs: { type: string, maxLength: 32 }
              total_bytes: { $ref: '#/components/schemas/Bytes' }
              used_bytes: { $ref: '#/components/schemas/Bytes' }
              free_bytes: { $ref: '#/components/schemas/Bytes' }
        network:
          type: object
          required: [received_total_bytes, sent_total_bytes, received_bytes_per_second, sent_bytes_per_second]
          additionalProperties: false
          properties:
            received_total_bytes: { $ref: '#/components/schemas/Bytes' }
            sent_total_bytes: { $ref: '#/components/schemas/Bytes' }
            received_bytes_per_second: { type: number, nullable: true, minimum: 0 }
            sent_bytes_per_second: { type: number, nullable: true, minimum: 0 }
            errors_in_total: { $ref: '#/components/schemas/Bytes' }
            errors_out_total: { $ref: '#/components/schemas/Bytes' }
            drops_in_total: { $ref: '#/components/schemas/Bytes' }
            drops_out_total: { $ref: '#/components/schemas/Bytes', description: 'Optional. A Mac counts drops on the way in only.' }
        disk_io:
          type: object
          required: [read_bytes_per_second, write_bytes_per_second]
          additionalProperties: false
          description: 'Optional. Disk speed over all whole disks (Linux /proc/diskstats; macOS IOKit). Left out while measuring and when the system gives no numbers.'
          properties:
            read_bytes_per_second: { type: number, minimum: 0 }
            write_bytes_per_second: { type: number, minimum: 0 }
        process_count: { type: integer, minimum: 0, maximum: 4194304, description: 'Optional. How many programs run in all (the list below holds the busiest 15).' }
        gpus:
          type: array
          minItems: 1
          maxItems: 8
          description: 'Optional. At most 8 GPUs; a number the helper cannot read without root is null (or, for the optional fields below, left out), never 0. The parent drops a number outside its range, it never clamps.'
          items:
            type: object
            required: [name, utilization_percent, memory_used_bytes, memory_total_bytes, temperature_celsius]
            additionalProperties: false
            properties:
              name: { type: string, maxLength: 64 }
              vendor: { type: string, enum: [nvidia, amd, apple, intel, unknown], description: 'Optional, added without a version change. The parent turns any other text into unknown.' }
              utilization_percent: { $ref: '#/components/schemas/PctOrNull' }
              memory_used_bytes: { type: integer, nullable: true, minimum: 0 }
              memory_total_bytes: { type: integer, nullable: true, minimum: 0, description: 'A Mac reports the computer''s whole memory (the GPU shares it).' }
              temperature_celsius: { type: number, nullable: true, minimum: 1, maximum: 150 }
              power_watts: { type: number, minimum: 0, maximum: 2000, description: 'Optional. Left out when unreadable.' }
              power_limit_watts: { type: number, minimum: 0, maximum: 2000, description: 'Optional.' }
              fan_percent: { type: number, minimum: 0, maximum: 100, description: 'Optional.' }
              clock_mhz: { type: number, minimum: 1, maximum: 20000, description: 'Optional. Current core clock.' }
              processes:
                type: array
                maxItems: 8
                description: 'Optional, NVIDIA only. Programs holding GPU memory, biggest first; left out when the helper could not list them.'
                items:
                  type: object
                  required: [name, memory_bytes]
                  additionalProperties: false
                  properties:
                    name: { type: string, maxLength: 64 }
                    memory_bytes: { $ref: '#/components/schemas/Bytes' }
        processes:
          type: array
          maxItems: 15
          items:
            type: object
            required: [pid, name, user, cpu_percent, memory_bytes]
            additionalProperties: false
            properties:
              pid: { type: integer, minimum: 0 }
              name: { type: string, maxLength: 64 }
              user: { type: string, maxLength: 64 }
              cpu_percent: { type: number, nullable: true, minimum: 0 }
              memory_bytes: { $ref: '#/components/schemas/Bytes' }
              threads: { type: integer, minimum: 1, maximum: 1000000, description: 'Optional. Thread count of the program.' }
    HistoryPoint:
      type: object
      required: [t, cpu_percent, mem_used, mem_cached, mem_total, swap_used, swap_total, net_in_bps, net_out_bps]
      additionalProperties: false
      properties:
        t: { type: integer, minimum: 0, description: 'Seconds since 1970 when the parent got the reading.' }
        cpu_percent: { $ref: '#/components/schemas/Pct' }
        cpu_breakdown: { type: object, additionalProperties: { $ref: '#/components/schemas/Pct' }, description: 'Optional. Same keys as cpu.breakdown.' }
        load:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number, minimum: 0 }
          description: 'Optional. 1, 5 and 15 minute load.'
        mem_used: { $ref: '#/components/schemas/Bytes' }
        mem_cached: { $ref: '#/components/schemas/Bytes' }
        mem_total: { $ref: '#/components/schemas/Bytes' }
        swap_used: { $ref: '#/components/schemas/Bytes' }
        swap_total: { $ref: '#/components/schemas/Bytes' }
        disk_read: { type: number, minimum: 0 }
        disk_write: { type: number, minimum: 0 }
        net_in_bps: { type: number, nullable: true, minimum: 0 }
        net_out_bps: { type: number, nullable: true, minimum: 0 }
        net_drops: { $ref: '#/components/schemas/Bytes', description: 'Optional. Packets dropped since boot, in and out added.' }
        processes_count: { type: integer, minimum: 0 }
        gpus:
          type: array
          minItems: 1
          maxItems: 8
          description: 'Optional. One entry per GPU that had a number this time, `index` being its place in the reading''s gpus list. A number the helper did not give is left out (a gap), never 0. No GPU: no key.'
          items:
            type: object
            required: [index]
            additionalProperties: false
            properties:
              index: { type: integer, minimum: 0, maximum: 7 }
              utilization_percent: { $ref: '#/components/schemas/Pct' }
              memory_used_bytes: { $ref: '#/components/schemas/Bytes' }
              temperature_celsius: { type: number, minimum: 1, maximum: 150 }
              power_watts: { type: number, minimum: 0, maximum: 2000 }
    MachineStatsHistory:
      type: object
      required: [interval_seconds, points]
      additionalProperties: false
      properties:
        interval_seconds: { type: integer, minimum: 1, maximum: 60, description: 'Ten in real use; a test run may shorten it.' }
        points:
          type: array
          maxItems: 360
          items: { $ref: '#/components/schemas/HistoryPoint' }
    MachineStatsReply:
      type: object
      required: [state, last_seen, fetched_at, stats]
      additionalProperties: false
      properties:
        state: { type: string, enum: [online, offline, old_helper] }
        last_seen: { type: string, nullable: true }
        fetched_at: { type: string, nullable: true }
        stats:
          oneOf: [ { $ref: '#/components/schemas/Stats' }, { type: 'null' } ]
    GpuCheck:
      type: object
      required: [gpu_visible, how, detail, note]
      additionalProperties: false
      properties:
        gpu_visible: { type: boolean }
        how: { type: string, enum: [nvidia-smi, device nodes, none], description: 'what answered: nvidia-smi, the NVIDIA device files, or nothing' }
        detail: { type: string, maxLength: 1500, description: 'the card and driver nvidia-smi printed, or the device files found; may be empty' }
        note: { type: string, minLength: 1, maxLength: 300, description: 'one plain sentence, for example: The GPU device is there but nvidia-smi is not installed in this image.' }
    SshKeysApply:
      type: object
      required: [keys]
      additionalProperties: false
      properties:
        keys:
          type: array
          maxItems: 20
          description: 'the complete list of authorized_keys lines for root of the VM, in the order they were added'
          items: { type: string, minLength: 1, maxLength: 800, pattern: '^[^\r\n\x00]+$', description: 'one line: type, base64, optional comment (already validated by the Root)' }
        install_sshd: { type: boolean, default: false, description: 'true: the helper also installs, locks to keys only, and starts the SSH server inside the VM when it is missing (keys are written first; up to 5 minutes). Absent or false: only report.' }
    AppInstall:
      type: object
      required: [app]
      additionalProperties: false
      properties:
        app: { type: string, enum: [openclaw, hermes] }
    AppInstalled:
      type: object
      required: [app, installed, version, installer_sha256]
      additionalProperties: false
      properties:
        app: { type: string, enum: [openclaw, hermes] }
        installed: { type: boolean, description: 'false: the app was there already and nothing changed' }
        version: { type: string, nullable: true, maxLength: 64 }
        installer_sha256: { type: string, nullable: true, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 of the installer script that ran' }
    AppInstallError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, log_tail]
          additionalProperties: false
          properties:
            code: { type: string, enum: [app_install_failed] }
            message: { type: string, minLength: 1, description: plain words }
            log_tail: { type: array, maxItems: 12, items: { type: string, maxLength: 200 }, description: 'the last lines the installer printed; plain text' }
    AppView:
      type: object
      required: [app, state, message, log_tail, version, started_at]
      additionalProperties: false
      properties:
        app: { type: string, enum: [openclaw, hermes, null], nullable: true, description: 'null when no app is wanted in this VM' }
        state: { type: string, enum: [none, installing, ready, failed] }
        message: { type: string, nullable: true, maxLength: 300, description: 'plain reason, only while failed' }
        log_tail: { type: array, maxItems: 12, items: { type: string, maxLength: 200 }, description: 'the last lines the installer printed, only while failed; render as text only' }
        version: { type: string, nullable: true, maxLength: 64 }
        started_at: { type: integer, nullable: true, description: 'seconds since 1970, when the last install began' }
    SshKeysApplied:
      type: object
      required: [applied, sshd]
      additionalProperties: false
      properties:
        applied: { type: integer, minimum: 0, maximum: 20, description: 'how many keys are in the VM now' }
        sshd: { type: string, enum: [running, installed, missing] }
        installed: { type: boolean, description: 'present only when install_sshd was true: true when this call installed the SSH server package' }
    SshKeyAdd:
      type: object
      required: [public_key]
      additionalProperties: false
      properties:
        public_key: { type: string, minLength: 1, maxLength: 4096, description: 'one SSH public key line; the Root refuses anything but a plain key of an allowed type' }
    SshKeyEntry:
      type: object
      required: [id, type, fingerprint, comment, added_at]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [ssh-ed25519, ecdsa-sha2-nistp256, ecdsa-sha2-nistp384, ecdsa-sha2-nistp521, ssh-rsa, sk-ssh-ed25519@openssh.com] }
        fingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$', description: 'as `ssh-keygen -lf` prints it' }
        comment: { type: string, maxLength: 64, description: 'may be empty' }
        added_at: { type: integer, description: 'seconds since 1970' }
    SshKeysView:
      type: object
      required: [keys, applied, sshd, sshd_state, sshd_message, connect]
      additionalProperties: false
      properties:
        keys: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SshKeyEntry' } }
        applied: { type: boolean, description: 'the last apply to the VM worked and nothing has changed since' }
        sshd: { type: string, enum: [running, installed, missing, unknown], description: 'what the helper last reported about the SSH server in the VM; unknown when it never has' }
        sshd_state: { type: string, enum: [idle, installing, failed], description: 'setting up the SSH server inside the VM; installing older than 6 minutes is read as failed' }
        sshd_message: { type: string, nullable: true, maxLength: 300, description: 'plain reason, only while failed' }
        connect: { $ref: '#/components/schemas/SshConnect' }
    SshConnect:
      type: object
      required: [jump, jump_is_default, vm_address, command]
      additionalProperties: false
      properties:
        jump: { type: string, nullable: true, maxLength: 120, description: 'the machine as user@host[:port]: the machine setting ssh_jump, or the address it was added with; null when neither exists' }
        jump_is_default: { type: boolean, description: 'true when jump comes from the address the machine was added with' }
        vm_address: { type: string, nullable: true, description: 'the VM address, only when it looks like an IP address or host name' }
        command: { type: string, nullable: true, pattern: '^ssh -J [A-Za-z0-9._-]+@[A-Za-z0-9.-]+(:[0-9]{1,5})? root@[A-Za-z0-9.:-]+$', description: 'ssh -J jump root@vm_address; null when either part is missing' }
    TerminalTicket:
      type: object
      required: [ticket, expires_in]
      additionalProperties: false
      properties:
        ticket: { type: string, minLength: 32 }
        expires_in: { type: integer, enum: [30] }
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string }
            message: { type: string }
    Refusal:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, resource, needed, free]
          additionalProperties: false
          properties:
            code: { type: string, enum: [not_enough_room, missing_capability] }
            message: { type: string }
            resource: { type: string, enum: [ram_mb, disk_gb, capability] }
            needed: { type: integer, minimum: 0 }
            free: { type: integer, minimum: 0 }
    HelperUpdateResult:
      type: object
      required: [result, message]
      additionalProperties: false
      properties:
        result: { type: string, enum: [updated, rolled_back, failed] }
        message: { type: string, description: A fixed sentence in plain words; never text from the other computer. }
    Health:
      type: object
      required: [status, agent_version, contract_version]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok] }
        agent_version: { $ref: '#/components/schemas/ReportedVersion' }
        contract_version: { type: string }
        bundle_version: { type: string, nullable: true }
    Facts:
      type: object
      required: [os, arch, cpu_cores, ram_total_mb, disk_total_gb, free_ram_mb, free_disk_gb, gpu, capabilities, agent_version, engine]
      additionalProperties: false
      properties:
        os: { type: string, enum: [macos, linux, windows] }
        arch: { type: string, enum: [arm64, aarch64, x86_64] }
        cpu_cores: { type: integer, minimum: 1 }
        cpu_model: { type: string, maxLength: 120, description: 'Optional (absent means unknown; an older helper does not say it). The name of the machine CPU as the system reports it, for example AMD EPYC 7763 64-Core Processor or Apple M4. Printable text only, at most 120 characters. The Root cleans it (control characters removed, runs of spaces made one, cut to 120) and shows it as plain text. Added without a version change.' }
        hardware:
          type: object
          additionalProperties: false
          description: 'Optional (absent means unknown; an older helper and the macOS helper do not say it). What the machine is made of, as its system reports it, for the panel''s spec rows. Every key inside is optional too: a helper leaves out what it cannot read. The Root cleans each text like cpu_model, keeps the object per machine (replaced by every heartbeat; null when the helper does not say) and returns it as `hardware` on every machine of GET /api/machines and on the machine detail. Added without a version change.'
          properties:
            system: { type: string, maxLength: 120, description: 'The make and model of the computer, for example NVIDIA DGX Spark or ASUS ROG CROSSHAIR VIII IMPACT (Linux: /sys/class/dmi/id, the product name, else the board name when the product name is a maker''s placeholder such as System Product Name; an Arm board without DMI: /proc/device-tree/model).' }
            core_types:
              type: array
              minItems: 1
              maxItems: 8
              description: 'Each kind of CPU core, in the order lscpu lists them. A chip with big and small cores has two, for example 10 Cortex-X925 and 10 Cortex-A725 on a DGX Spark; most x86 machines have one.'
              items:
                type: object
                required: [name, cores]
                additionalProperties: false
                properties:
                  name: { type: string, maxLength: 120 }
                  cores: { type: integer, minimum: 1, maximum: 100000, description: 'Physical cores of this kind, over all sockets (threads not counted).' }
                  max_mhz: { type: integer, minimum: 1, maximum: 20000, description: 'Optional. The highest clock these cores run at.' }
            disks:
              type: array
              minItems: 1
              maxItems: 8
              description: 'The physical drives, biggest first (Linux: /sys/block, without loop, RAM, device-mapper, RAID and optical devices, and without a drive that does not say its model).'
              items:
                type: object
                required: [model, size_gb, kind]
                additionalProperties: false
                properties:
                  model: { type: string, maxLength: 120 }
                  size_gb: { type: integer, minimum: 1, maximum: 100000000, description: 'Decimal GB (10^9 bytes), as drives are sold.' }
                  kind: { type: string, enum: [nvme, ssd, hdd] }
        ram_total_mb: { type: integer, minimum: 1 }
        disk_total_gb: { type: integer, minimum: 1 }
        free_ram_mb: { type: integer, minimum: 0 }
        free_disk_gb: { type: integer, minimum: 0 }
        gpu:
          type: array
          items:
            type: object
            required: [vendor, model]
            additionalProperties: false
            properties:
              vendor: { type: string }
              model: { type: string }
              memory_mb: { type: integer, minimum: 0 }
              architecture: { type: string, maxLength: 32, description: 'Optional. The GPU family, for example Blackwell (NVIDIA: named from compute_capability). Added without a version change, like the four below.' }
              compute_capability: { type: string, pattern: '^[0-9]{1,2}\.[0-9]{1,2}$', description: 'Optional. NVIDIA''s compute capability, for example 12.1.' }
              driver_version: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.-]{0,31}$', description: 'Optional. The GPU driver''s version, for example 580.173.02.' }
              max_clock_mhz: { type: integer, minimum: 1, maximum: 20000, description: 'Optional. The highest core clock.' }
              uses_system_memory: { type: boolean, description: 'Optional (absent means unknown). True when the GPU has no memory of its own and works in the machine''s memory, as on a DGX Spark (NVIDIA: addressing mode ATS and no memory.total). memory_mb is then left out.' }
        capabilities:
          type: object
          required: [vm, container, gpu_in_vm, gpu_in_container]
          additionalProperties: false
          properties:
            vm: { type: boolean }
            container: { type: boolean }
            gpu_in_vm: { type: boolean }
            gpu_in_container: { type: boolean, description: 'True only when an NVIDIA card was found AND NVIDIA''s container toolkit works on the machine, looked at again each time (so installing the toolkit needs no restart). A card without the toolkit is not a `problem`: the machine still makes VMs and containers.' }
            gpu_memory_limit: { type: boolean, description: 'Optional (absent means false). True when the helper can cap and watch the GPU memory of a container (`gpu_memory_gb` on create). Always equal to `gpu_in_container`. The Root refuses a limit on a machine that does not say true.' }
            terminal: { type: boolean, description: 'Optional (absent means false). True when the helper serves the console route `GET /v1/workloads/{id}/terminal`. The Linux helper says true; the macOS helper may say true too. Added without a version change.' }
            cpu_models:
              type: array
              maxItems: 64
              uniqueItems: true
              items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$' }
              description: 'Optional (absent means `[host]` only). The CPU models a VM on this machine can be given (`cpu_type` on create), `host` first: the machine''s own CPU, which is what every VM got before this field. A helper lists only models its engine knows. Added without a version change.'
            cpu_topology: { type: boolean, description: 'Optional (absent means false). True when a VM can be given more than one socket (`cpu_sockets` on create). Added without a version change.' }
            cpu_flags:
              type: array
              maxItems: 8
              uniqueItems: true
              items: { type: string, enum: [nested-virt, aes] }
              description: 'Optional (absent means none). The CPU flags a VM can have switched on or off (`cpu_flags` on create). `nested-virt` is `svm` on an AMD machine and `vmx` on an Intel one, so only an x86 machine whose CPU maker is known lists it. Added without a version change.'
            cpu_limit: { type: boolean, description: 'Optional (absent means false). True when a container can get a hard cap on its CPU time (`cpu_limit_percent` on create). Added without a version change.' }
            sandbox: { type: boolean, description: 'Optional (absent means false). True when this helper can run sandboxes right now (Firecracker, /dev/kvm and a ready template). Only such a machine is given sandboxes, and only it says `sandbox` in its facts. Added without a version change.' }
        sandbox:
          $ref: '#/components/schemas/SandboxFacts'
          description: >
            Optional (absent means none, and an older helper never says it). What this helper can offer for sandboxes, sent exactly when `capabilities.sandbox` is true;
            the Root keeps it with the machine and places no sandbox on a machine without it. Added without a version change.
        agent_version:
          description: The version of this Agent program. The same text as /v1/health. (Contract 1.3.0)
          $ref: '#/components/schemas/ReportedVersion'
        agent_build:
          description: >
            Which build of this Agent program runs: the lowercase hex SHA-256 of the program's own file, worked out once at start. Optional, added without a version change;
            a helper that does not say it is an older one. The Root keeps the last one per machine, returns it on `GET /api/machines` and the machine detail, and compares it with the builds it can install.
          type: string
          pattern: '^[0-9a-f]{64}$'
        engine:
          description: The program this Agent makes VMs with, its version when it can tell, and whether it works right now. (Contract 1.3.0)
          type: object
          required: [name, version, ready]
          additionalProperties: false
          properties:
            name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$', description: 'for example apple-container, incus, simulated' }
            version: { description: Null when the engine cannot tell its version; never guessed., type: string, nullable: true, pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,31}$' }
            ready: { type: boolean, description: False while the machine has a problem that stops it from running workloads }
        problems:
          description: >
            Things on the machine that stop it from running workloads, each with the way to fix it. Empty or missing means ready.
            The Root shows them and places nothing on a machine that has any.
          type: array
          maxItems: 20
          items:
            type: object
            required: [code, message, fix]
            additionalProperties: false
            properties:
              code: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
              message: { type: string, minLength: 1, maxLength: 300 }
              fix: { type: string, maxLength: 500 }
    ReportedVersion:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,31}$'
    SandboxFacts:
      description: >
        What a helper can offer for sandboxes (see sandbox/README.md). Optional, added without a version change; only a helper whose `capabilities.sandbox` is true sends it,
        and the Root drops it from a helper that says false.
      type: object
      required: [engine, max_running, running, paused, max_vcpu, max_ram_mb, max_disk_mb, booked, templates, changes]
      additionalProperties: false
      properties:
        engine:
          description: The program that runs the sandboxes, with its version when it can tell; never guessed.
          type: object
          required: [name, version]
          additionalProperties: false
          properties:
            name: { type: string, enum: [firecracker, simulated], description: 'The program that runs the sandboxes. `simulated` is the test engine of the Fake Agent and of a helper started with its simulated engine: it makes no real microVM, so a Root running a real deployment never sees it.' }
            version: { type: string, nullable: true, pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,31}$' }
        max_running: { type: integer, minimum: 0, description: 'How many sandboxes may run at once here (set on the machine).' }
        running: { type: integer, minimum: 0 }
        paused: { type: integer, minimum: 0 }
        max_vcpu: { type: integer, minimum: 1, description: 'The most vCPUs one sandbox may have here.' }
        max_ram_mb: { type: integer, minimum: 256 }
        max_disk_mb: { type: integer, minimum: 512 }
        booked:
          type: object
          required: [vcpu, ram_mb, disk_mb]
          additionalProperties: false
          description: What running sandboxes hold (vCPU, memory) and what all of them hold on disk, paused ones included.
          properties:
            vcpu: { type: integer, minimum: 0 }
            ram_mb: { type: integer, minimum: 0 }
            disk_mb: { type: integer, minimum: 0 }
        templates:
          type: array
          maxItems: 64
          description: The templates built on this machine, and whether each is ready to make a sandbox from.
          items:
            type: object
            required: [id, build, ready]
            additionalProperties: false
            properties:
              id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
              build: { type: string, pattern: '^[a-z0-9]{1,32}$' }
              ready: { type: boolean }
        changes: { type: integer, minimum: 0, description: 'The number of the last sandbox event. When it moves, the Root reads the helper''s sandbox events.' }
    SandboxId:
      type: string
      pattern: '^[a-z0-9]{20}$'
      description: Made by the Root. Lowercase letters and digits only, so `49983-<id>.<domain>` is a valid host name.
    SandboxBuild:
      type: string
      pattern: '^[a-z0-9]{1,32}$'
    SandboxTemplateId:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    SandboxTime:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
      description: UTC, as `2026-10-24T09:30:00Z`.
    SandboxEndBehaviour:
      type: string
      enum: [kill, pause]
      description: What happens at the end time. `pause` is a later slice; a helper that cannot pause treats it as `kill`, so a sandbox never outlives its time.
    SandboxCreate:
      type: object
      required: [id, template, vcpu, ram_mb, disk_mb, end_at, on_end, internet, env_vars, access_token]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/SandboxId' }
        template: { $ref: '#/components/schemas/SandboxTemplateId' }
        vcpu: { type: integer, minimum: 1, maximum: 32 }
        ram_mb: { type: integer, minimum: 256, maximum: 65536 }
        disk_mb: { type: integer, minimum: 512, maximum: 102400 }
        end_at: { $ref: '#/components/schemas/SandboxTime' }
        on_end: { $ref: '#/components/schemas/SandboxEndBehaviour' }
        internet:
          type: boolean
          description: 'False: the sandbox reaches nothing outside itself. True: the internet only; the office network, this machine, other sandboxes and private addresses stay closed either way.'
        env_vars:
          type: object
          maxProperties: 100
          additionalProperties: { type: string, maxLength: 16384 }
          description: 'Set for every command run in the sandbox. Keys match ^[A-Za-z_][A-Za-z0-9_]{0,127}$.'
        access_token:
          type: string
          minLength: 32
          maxLength: 128
          description: >
            Secret. The Root derives it as hex(HMAC-SHA256(its own secret, sandbox id)), as E2B does, so it can hand the same token back on connect without
            storing it. The helper sends it to the daemon inside (and its hash into the microVM's metadata service) and then forgets it: never logged, never
            returned, never stored.
    SandboxEnd:
      type: object
      required: [end_at, on_end]
      additionalProperties: false
      properties:
        end_at: { $ref: '#/components/schemas/SandboxTime' }
        on_end: { $ref: '#/components/schemas/SandboxEndBehaviour' }
    Sandbox:
      type: object
      required: [id, template, build, state, vcpu, ram_mb, disk_mb, internet, started_at, end_at, on_end, running_ms, daemon_version]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/SandboxId' }
        template: { $ref: '#/components/schemas/SandboxTemplateId' }
        build: { $ref: '#/components/schemas/SandboxBuild' }
        state: { type: string, enum: [starting, running, pausing, paused, resuming, stopping] }
        vcpu: { type: integer, minimum: 1 }
        ram_mb: { type: integer, minimum: 256 }
        disk_mb: { type: integer, minimum: 512 }
        internet: { type: boolean }
        started_at: { $ref: '#/components/schemas/SandboxTime' }
        end_at: { $ref: '#/components/schemas/SandboxTime' }
        on_end: { $ref: '#/components/schemas/SandboxEndBehaviour' }
        running_ms: { type: integer, minimum: 0, description: 'All the time it has been running, in milliseconds, paused time not counted. Worked out again each time it is sent, so it only grows.' }
        daemon_version: { type: string, nullable: true, maxLength: 32, description: 'The in-guest daemon''s version, null when it did not say.' }
        timings_ms:
          type: object
          additionalProperties: false
          description: Optional. How long the last start or resume took, for the panel and for tuning.
          properties:
            restore: { type: integer, minimum: 0 }
            ready: { type: integer, minimum: 0 }
    SandboxList:
      type: object
      required: [sandboxes]
      additionalProperties: false
      properties:
        sandboxes:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/Sandbox' }
    SandboxRefusal:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, enum: [not_enough_room, template_not_ready, id_taken] }
            message: { type: string }
            resource: { type: string, enum: [slots, vcpu, ram_mb, disk_mb] }
            needed: { type: integer, minimum: 0 }
            free: { type: integer, minimum: 0 }
    SandboxStartFailure:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, log_tail]
          additionalProperties: false
          properties:
            code: { type: string, enum: [start_timeout] }
            message: { type: string }
            log_tail:
              type: array
              maxItems: 12
              items: { type: string, maxLength: 200 }
    SandboxEvents:
      type: object
      required: [events, last]
      additionalProperties: false
      properties:
        last: { type: integer, minimum: 0, description: 'The number of the newest event this helper has.' }
        events:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [seq, at, id, kind, running_ms]
            additionalProperties: false
            properties:
              seq: { type: integer, minimum: 1 }
              at: { $ref: '#/components/schemas/SandboxTime' }
              id: { $ref: '#/components/schemas/SandboxId' }
              kind: { type: string, enum: [started, paused, resumed, ended] }
              reason:
                type: string
                enum: [deleted, timeout, out_of_memory, crashed, helper_restart]
                description: 'Only on `ended`. `helper_restart` means the helper found it left over after its own restart and removed it.'
              running_ms: { type: integer, minimum: 0, description: 'The sandbox''s running time at that moment. The Root counts the difference from the last event it saw.' }
    SandboxMetrics:
      type: object
      required: [samples]
      additionalProperties: false
      properties:
        samples:
          type: array
          maxItems: 720
          items:
            type: object
            required: [at, cpu_count, cpu_used_pct, mem_used_mb, mem_total_mb, disk_used_mb, disk_total_mb]
            additionalProperties: false
            properties:
              at: { $ref: '#/components/schemas/SandboxTime' }
              cpu_count: { type: integer, minimum: 1 }
              cpu_used_pct: { type: number, minimum: 0, maximum: 100 }
              mem_used_mb: { type: integer, minimum: 0 }
              mem_total_mb: { type: integer, minimum: 0 }
              disk_used_mb: { type: integer, minimum: 0 }
              disk_total_mb: { type: integer, minimum: 0 }
    SandboxTemplateList:
      type: object
      required: [templates]
      additionalProperties: false
      properties:
        templates:
          type: array
          maxItems: 64
          items:
            type: object
            required: [id, build, state, built_at, size_mb, message]
            additionalProperties: false
            properties:
              id: { $ref: '#/components/schemas/SandboxTemplateId' }
              build: { $ref: '#/components/schemas/SandboxBuild' }
              state: { type: string, enum: [building, ready, failed] }
              built_at: { type: string, nullable: true, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' }
              size_mb: { type: integer, minimum: 0 }
              message: { type: string, nullable: true, maxLength: 300, description: Why a build failed, in plain words. }
    Workload:
      type: object
      required: [id, name, kind, state, cpu, ram_mb, disk_gb, gpu_mode, bundle_version]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        kind: { type: string, enum: [vm, container] }
        state: { type: string, enum: [provisioning, running, stopped, failed, deleting] }
        cpu: { type: integer, minimum: 1 }
        ram_mb: { type: integer, minimum: 1 }
        disk_gb: { type: integer, minimum: 1 }
        gpu_mode: { type: string, enum: [none, container, passthrough] }
        address: { type: string, nullable: true }
        bundle_version: { type: string, nullable: true }
        stopped_reason: { $ref: '#/components/schemas/StoppedReason' }
        gpu_memory_gb: { type: integer, nullable: true, minimum: 1, maximum: 1024, description: 'Optional. The GPU memory limit of this container in GB; null or absent when it shares the whole card.' }
        init_mode:
          type: string
          enum: [systemd, plain]
          description: >
            Optional. How a VM came up: with systemd, or plain (a process that only keeps it alive: a terminal works, services such as systemd do not).
            Left out when the helper does not know.
    StoppedReason:
      type: object
      nullable: true
      additionalProperties: false
      description: >
        Every field is optional. A VM that quit by itself has `exit_code` and `log_tail`; a container the helper stopped because it stayed over its GPU memory limit has `code` (`gpu_memory_over_limit`), `message`, `used_gb` and `limit_gb`.
        Optional, only on a workload that is stopped (or failed) and that the helper did not stop on request. Why it stopped, as the helper found it.
        `log_tail` is text from inside the VM: at most 12 lines and 2048 bytes, escape sequences and control characters removed. It is data, never markup.
        The Root cleans and caps it again, keeps it with the workload, and drops it as soon as the workload runs again or is gone.
      properties:
        exit_code: { type: integer, nullable: true, minimum: -1000, maximum: 1000 }
        log_tail: { type: string, maxLength: 20000 }
        code: { type: string, pattern: '^[a-z0-9_]{1,64}$', description: 'Why, as a short code, for example `gpu_memory_over_limit`.' }
        message: { type: string, maxLength: 20000, description: 'The reason in plain words. Text, never markup; the Root cleans it and keeps at most 300 bytes.' }
        used_gb: { type: number, minimum: 0, maximum: 1000000 }
        limit_gb: { type: number, minimum: 0, maximum: 1000000 }
    WorkloadList:
      type: object
      required: [workloads]
      additionalProperties: false
      properties:
        workloads:
          type: array
          items: { $ref: '#/components/schemas/Workload' }
    WorkloadCreate:
      type: object
      required: [command_id, name, kind, cpu, ram_mb, disk_gb]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        kind: { type: string, enum: [vm, container] }
        cpu: { type: integer, minimum: 1, maximum: 64 }
        ram_mb: { type: integer, minimum: 512, maximum: 1048576 }
        disk_gb: { type: integer, minimum: 1, maximum: 100000 }
        gpu_mode: { type: string, enum: [none, container, passthrough], default: none }
        image: { type: string, pattern: '^[a-z0-9][a-z0-9._:/-]{0,127}$' }
        bundle: { $ref: '#/components/schemas/ImageId' }
        gpu_memory_gb: { type: integer, minimum: 1, maximum: 1024, description: 'Optional. Caps the GPU memory this container may use, in GB. Only with kind container and gpu_mode container, else 400. The helper watches it and stops a container that stays over. Absent: the whole card is shared. The Root sends it only to a helper that says `gpu_memory_limit: true`.' }
        cpu_sockets: { type: integer, minimum: 1, maximum: 8, description: 'Optional. How many sockets the VM''s CPUs are spread over; `cpu` must be a multiple of it (cores per socket = cpu / cpu_sockets). Only with kind vm (a container with it is a 400 whatever the value) and on a helper that says `cpu_topology: true`, else 400. Absent or 1: the engine''s own layout, as before. The Root sends it only when it is 2 or more.' }
        cpu_type: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$', description: 'Optional. The CPU model the VM sees: one of the helper''s `cpu_models` (a helper that does not say them offers `host` only), else 400. Only with kind vm (a container with it is a 400 whatever the value). Absent or `host`: the machine''s own CPU, as before. The Root sends it only when it is not `host`.' }
        cpu_flags:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            nested-virt: { type: string, enum: ['on', 'off'] }
            aes: { type: string, enum: ['on', 'off'] }
          description: 'Optional. CPU flags switched on or off for the VM; a flag left out keeps what the CPU model gives. Each key must be in the helper''s `cpu_flags`, else 400; an empty object is a 400. Only with kind vm.'
        cpu_limit_percent: { type: integer, minimum: 10, maximum: 6400, description: 'Optional. A hard cap on the container''s CPU time, in percent of one core (150 is one and a half cores); at most `cpu` x 100. Only with kind container (a VM with it is a 400) and on a helper that says `cpu_limit: true`, else 400. Absent: no cap.' }
    ImageId:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
      description: >
        A catalog id (`blank`, `openclaw`, `hermes`). Optional on create, added without a version change; absent means `blank`. The Root only sends it for an image that is ready and not `blank`,
        and never forwards a name from the browser: `image` comes from the machine's own saved default. Helpers refuse unknown fields, so a helper has to be updated before any image other than `blank` is ready.
        `openclaw` and `hermes` are apps, not images: on `POST /api/workloads` the parent makes the VM from the stock image, never sends them to the helper as `bundle`, and installs the app afterwards with PUT /v1/workloads/{id}/app. They can be chosen on a machine exactly when its helper says `ready` for them in GET /v1/images.
    HelperImages:
      type: object
      required: [images]
      additionalProperties: false
      properties:
        images:
          type: array
          maxItems: 16
          items:
            type: object
            required: [id, ready, built_at]
            additionalProperties: false
            properties:
              id: { $ref: '#/components/schemas/ImageId' }
              ready: { type: boolean }
              built_at: { type: string, maxLength: 64, nullable: true, description: when it was built (ISO 8601), null for the stock image }
              caption: { type: string, maxLength: 200, nullable: true, description: 'optional. For `openclaw` and `hermes` on a helper that installs apps: ready is true and the caption is "Installs after the VM starts, about 2 minutes". An older helper keeps ready false.' }
    ImageCatalog:
      type: object
      required: [images]
      additionalProperties: false
      properties:
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageEntry' }
    ImageEntry:
      type: object
      required: [id, title, description, state, reason]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/ImageId' }
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 300 }
        state: { type: string, enum: [ready, planned] }
        reason: { type: string, nullable: true, maxLength: 300, description: why a planned image cannot be chosen yet; null for a ready one }
    MachineImages:
      type: object
      required: [helper, images]
      additionalProperties: false
      properties:
        helper: { type: string, enum: [answered, old_helper, unreachable] }
        images:
          type: array
          items:
            type: object
            required: [id, title, description, state, ready, available, reason]
            additionalProperties: false
            properties:
              id: { $ref: '#/components/schemas/ImageId' }
              title: { type: string, minLength: 1, maxLength: 100 }
              description: { type: string, minLength: 1, maxLength: 300 }
              state: { type: string, enum: [ready, planned] }
              ready: { type: boolean }
              available: { type: boolean }
              reason: { type: string, nullable: true, maxLength: 300 }
    BundleInstall:
      type: object
      required: [command_id, version, sha256]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        workload_id: { $ref: '#/components/schemas/Id' }
    BundleUninstall:
      type: object
      required: [command_id]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        workload_id: { $ref: '#/components/schemas/Id' }
    CommandAccepted:
      type: object
      required: [command_id, state]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        state: { type: string, enum: [queued, running, succeeded, failed] }
    Command:
      type: object
      required: [command_id, type, state]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [create, start, stop, delete, bundle_install, bundle_uninstall] }
        state: { type: string, enum: [queued, running, succeeded, failed] }
        workload_id: { $ref: '#/components/schemas/Id' }
        result:
          type: object
          nullable: true
          additionalProperties: true
    EnrollRequest:
      type: object
      required: [enrollment_token, name]
      additionalProperties: false
      properties:
        enrollment_token: { type: string, minLength: 16, maxLength: 256 }
        name: { $ref: '#/components/schemas/Name' }
    EnrollResponse:
      type: object
      required: [machine_token, command_token, heartbeat_seconds]
      additionalProperties: false
      properties:
        machine_token: { type: string, minLength: 32, description: the Agent shows this to the Root (heartbeats) }
        command_token: { type: string, minLength: 32, description: the Root shows this to the Agent (commands) }
        heartbeat_seconds: { type: integer, minimum: 1 }
    Heartbeat:
      type: object
      required: [facts, workloads]
      additionalProperties: false
      properties:
        facts: { $ref: '#/components/schemas/Facts' }
        workloads:
          type: array
          items: { $ref: '#/components/schemas/Workload' }
        bundle_version: { type: string, nullable: true }
