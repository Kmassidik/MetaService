openapi: 3.0.3
info:
  title: MetaService Root-Agent contract
  version: 1.3.0
  description: >
    The one API every MetaService Agent implements, and the part of the Root that Agents call.
    An Agent that passes contract/tests works with the Root, whatever language it is written in.
    JSON only. Every request carries a Bearer token: the Agent's command token when the Root calls an Agent,
    the machine token when an Agent calls the Root (heartbeat). Each side keeps the other's token secret.
    Every response carries the header X-MetaService-Contract with the contract version.
servers:
  - url: http://127.0.0.1:9101
security:
  - machineToken: []
paths:
  /v1/health:
    get:
      summary: Is the Agent alive, and which versions does it run
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/facts:
    get:
      summary: What this machine is and how much room it has
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Facts' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/stats:
    get:
      summary: >
        The machine's real state now (read only): CPU total and per core, load, memory, disks, network speed, GPU (key left out when the system cannot say), uptime, top 15 processes
        (program name and user only, never a command line). The helper computes percentages between its own samples; the first answer after a start has measuring true and null rates.
        Optional, added without a version change (a helper without it answers 404). Exact rules: docs/monitor-contract.md.
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/workloads:
    get:
      summary: Local VMs and containers
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/WorkloadList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a workload (runs the local space check first)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkloadCreate' } } }
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: not enough room or capability, content: { application/json: { schema: { $ref: '#/components/schemas/Refusal' } } } }
        '413': { $ref: '#/components/responses/TooLarge' }
  /v1/workloads/{id}/start:
    post:
      summary: Start a workload
      parameters: [ { $ref: '#/components/parameters/WorkloadId' }, { $ref: '#/components/parameters/CommandIdHeader' } ]
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/workloads/{id}/stop:
    post:
      summary: Stop a workload
      parameters: [ { $ref: '#/components/parameters/WorkloadId' }, { $ref: '#/components/parameters/CommandIdHeader' } ]
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/workloads/{id}:
    delete:
      summary: Delete a workload. The Agent backs up its disk first.
      parameters: [ { $ref: '#/components/parameters/WorkloadId' }, { $ref: '#/components/parameters/CommandIdHeader' } ]
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/workloads/{id}/terminal:
    get:
      summary: >
        A console in a running workload, as a WebSocket (RFC 6455). Frames: binary from the client are keystrokes and paste (at most 65536 bytes);
        a text frame {"resize":[cols,rows]} sets the window size (cols 1..500, rows 1..300; the start size is 80x24); binary from the server is terminal output.
        Anything else, or an oversized frame, closes the socket with code 1008. The shell ending, the workload stopping or being deleted closes it with 1000 and a short plain reason.
        The helper runs the engine's own "run a program inside the workload" in a pty and kills it when the socket closes. At most 1 console per workload.
        Without an Upgrade header the route runs the same checks and answers 426 when all pass (a preflight for exact statuses; a refused upgrade itself may be any non-101 answer).
      parameters: [ { $ref: '#/components/parameters/WorkloadId' } ]
      responses:
        '101': { description: switching protocols to WebSocket }
        '426': { description: upgrade required (preflight without upgrade headers; every check passed) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'the workload is not running (code not_running) or already has a console (code console_open)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/bundle/install:
    post:
      summary: Install or upgrade the chat bundle on the machine or in a workload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BundleInstall' } } }
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/bundle/uninstall:
    post:
      summary: Turn the chat off on the machine or in a workload. It stops; the folder with its conversations stays, so installing again brings them back.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BundleUninstall' } } }
      responses:
        '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/commands/{id}:
    get:
      summary: Status and result of a long command
      parameters: [ { $ref: '#/components/parameters/CommandId' } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Command' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/agents/enroll:
    post:
      summary: Root endpoint. Exchange a one-time enrollment token for a permanent machine token.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollResponse' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents/heartbeat:
    post:
      summary: Root endpoint. Facts and workload states, every 15 seconds.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Heartbeat' } } }
      responses:
        '204': { description: recorded }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/machines/{machine}/workloads/{workload}/terminal:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie, Host, Origin and CSRF checked like every operator write) } ]
    post:
      summary: Root endpoint for the panel. Ask for a one-time ticket to open a console in a running VM. Empty body. The ticket is single use, bound to the operator, valid 30 seconds.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/WorkloadId' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalTicket' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'wrong Origin, Host or CSRF token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'no such machine or VM (code not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'the VM is not running (code not_running), the machine is not a Mac (code not_supported), or it already has a console (code console_open)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: '4 consoles are open in total (code too_many_consoles)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'the machine is offline (code unreachable)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/machines/{machine}/stats:
    servers: [ { url: 'https://panel.example', description: the Root operator listener (session cookie and Host checked like every operator read) } ]
    get:
      summary: >
        Root endpoint for the panel. The machine's latest reading. The Root keeps one shared reading per machine (the helper is called at most once per 4 seconds however many tabs ask,
        and the reading is dropped after 30 seconds without a request) and applies the limits again before passing it on. An offline machine answers 200 with state offline and the last reading, or null.
      security: []
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/MachineStatsReply' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: wrong Host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: no such machine (code not_found), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/terminal/{ticket}:
    servers: [ { url: 'https://panel.example', description: the Root operator listener } ]
    get:
      summary: >
        Root endpoint for the panel. Upgrades to a WebSocket that carries the console frames (see /v1/workloads/{id}/terminal; the Root passes them through unchanged
        and never reads the content). Checks in this order: session cookie, Origin equals the panel's own origin, ticket valid and made by this operator.
        Any failure refuses the upgrade with a plain HTTP reply (401, 403, 404 or a bare 400) and never opens a socket. Idle for 15 minutes or 8 hours in total closes it with 1000;
        the machine going offline closes it with 1011 "the machine is offline". The audit log gets console_open and console_close (machine, VM, operator, seconds), never keystrokes or output.
      security: []
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: string, minLength: 32 } }
      responses:
        '101': { description: switching protocols to WebSocket }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: wrong Origin or operator, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    machineToken: { type: http, scheme: bearer }
  parameters:
    CommandIdHeader:
      name: X-Command-Id
      in: header
      required: false
      description: Makes a retry safe. The same id never runs twice. The Agent makes one up when it is missing.
      schema: { $ref: '#/components/schemas/Id' }
    WorkloadId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CommandId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
  responses:
    Unauthorized: { description: missing or wrong token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Invalid: { description: input failed validation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: no such thing, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooLarge: { description: request body too large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Id:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    Name:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    Pct:
      type: number
      minimum: 0
      maximum: 100
    PctOrNull:
      type: number
      nullable: true
      minimum: 0
      maximum: 100
    Bytes:
      type: integer
      minimum: 0
    Stats:
      type: object
      required: [taken_at, measuring, uptime_seconds, cpu, memory, disks, network, processes]
      additionalProperties: false
      properties:
        taken_at: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' }
        measuring: { type: boolean }
        uptime_seconds: { type: integer, minimum: 0 }
        cpu:
          type: object
          required: [core_count, total_percent, cores_percent, load]
          additionalProperties: false
          properties:
            core_count: { type: integer, minimum: 1, maximum: 1024 }
            total_percent: { $ref: '#/components/schemas/PctOrNull' }
            cores_percent:
              type: array
              nullable: true
              maxItems: 1024
              items: { $ref: '#/components/schemas/Pct' }
            load:
              type: object
              required: [one, five, fifteen]
              additionalProperties: false
              properties:
                one: { type: number, nullable: true, minimum: 0 }
                five: { type: number, nullable: true, minimum: 0 }
                fifteen: { type: number, nullable: true, minimum: 0 }
        memory:
          type: object
          required: [total_bytes, used_bytes, cached_bytes, free_bytes, swap_total_bytes, swap_used_bytes]
          additionalProperties: false
          properties:
            total_bytes: { $ref: '#/components/schemas/Bytes' }
            used_bytes: { $ref: '#/components/schemas/Bytes' }
            cached_bytes: { $ref: '#/components/schemas/Bytes' }
            free_bytes: { $ref: '#/components/schemas/Bytes' }
            swap_total_bytes: { $ref: '#/components/schemas/Bytes' }
            swap_used_bytes: { $ref: '#/components/schemas/Bytes' }
        disks:
          type: array
          maxItems: 16
          items:
            type: object
            required: [mount, name, fs, total_bytes, used_bytes, free_bytes]
            additionalProperties: false
            properties:
              mount: { type: string, maxLength: 128 }
              name: { type: string, maxLength: 64 }
              fs: { type: string, maxLength: 32 }
              total_bytes: { $ref: '#/components/schemas/Bytes' }
              used_bytes: { $ref: '#/components/schemas/Bytes' }
              free_bytes: { $ref: '#/components/schemas/Bytes' }
        network:
          type: object
          required: [received_total_bytes, sent_total_bytes, received_bytes_per_second, sent_bytes_per_second]
          additionalProperties: false
          properties:
            received_total_bytes: { $ref: '#/components/schemas/Bytes' }
            sent_total_bytes: { $ref: '#/components/schemas/Bytes' }
            received_bytes_per_second: { type: number, nullable: true, minimum: 0 }
            sent_bytes_per_second: { type: number, nullable: true, minimum: 0 }
        gpus:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            required: [name, utilization_percent, memory_used_bytes, memory_total_bytes, temperature_celsius]
            additionalProperties: false
            properties:
              name: { type: string, maxLength: 64 }
              utilization_percent: { $ref: '#/components/schemas/PctOrNull' }
              memory_used_bytes: { type: integer, nullable: true, minimum: 0 }
              memory_total_bytes: { type: integer, nullable: true, minimum: 0 }
              temperature_celsius: { type: number, nullable: true }
        processes:
          type: array
          maxItems: 15
          items:
            type: object
            required: [pid, name, user, cpu_percent, memory_bytes]
            additionalProperties: false
            properties:
              pid: { type: integer, minimum: 0 }
              name: { type: string, maxLength: 64 }
              user: { type: string, maxLength: 64 }
              cpu_percent: { type: number, nullable: true, minimum: 0 }
              memory_bytes: { $ref: '#/components/schemas/Bytes' }
    MachineStatsReply:
      type: object
      required: [state, last_seen, fetched_at, stats]
      additionalProperties: false
      properties:
        state: { type: string, enum: [online, offline] }
        last_seen: { type: string, nullable: true }
        fetched_at: { type: string, nullable: true }
        stats:
          oneOf: [ { $ref: '#/components/schemas/Stats' }, { type: 'null' } ]
    TerminalTicket:
      type: object
      required: [ticket, expires_in]
      additionalProperties: false
      properties:
        ticket: { type: string, minLength: 32 }
        expires_in: { type: integer, enum: [30] }
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string }
            message: { type: string }
    Refusal:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, resource, needed, free]
          additionalProperties: false
          properties:
            code: { type: string, enum: [not_enough_room, missing_capability] }
            message: { type: string }
            resource: { type: string, enum: [ram_mb, disk_gb, capability] }
            needed: { type: integer, minimum: 0 }
            free: { type: integer, minimum: 0 }
    Health:
      type: object
      required: [status, agent_version, contract_version]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok] }
        agent_version: { $ref: '#/components/schemas/ReportedVersion' }
        contract_version: { type: string }
        bundle_version: { type: string, nullable: true }
    Facts:
      type: object
      required: [os, arch, cpu_cores, ram_total_mb, disk_total_gb, free_ram_mb, free_disk_gb, gpu, capabilities, agent_version, engine]
      additionalProperties: false
      properties:
        os: { type: string, enum: [macos, linux, windows] }
        arch: { type: string, enum: [arm64, aarch64, x86_64] }
        cpu_cores: { type: integer, minimum: 1 }
        ram_total_mb: { type: integer, minimum: 1 }
        disk_total_gb: { type: integer, minimum: 1 }
        free_ram_mb: { type: integer, minimum: 0 }
        free_disk_gb: { type: integer, minimum: 0 }
        gpu:
          type: array
          items:
            type: object
            required: [vendor, model]
            additionalProperties: false
            properties:
              vendor: { type: string }
              model: { type: string }
              memory_mb: { type: integer, minimum: 0 }
        capabilities:
          type: object
          required: [vm, container, gpu_in_vm, gpu_in_container]
          additionalProperties: false
          properties:
            vm: { type: boolean }
            container: { type: boolean }
            gpu_in_vm: { type: boolean }
            gpu_in_container: { type: boolean }
        agent_version:
          description: The version of this Agent program. The same text as /v1/health. (Contract 1.3.0)
          $ref: '#/components/schemas/ReportedVersion'
        engine:
          description: The program this Agent makes VMs with, its version when it can tell, and whether it works right now. (Contract 1.3.0)
          type: object
          required: [name, version, ready]
          additionalProperties: false
          properties:
            name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$', description: 'for example apple-container, incus, simulated' }
            version: { description: Null when the engine cannot tell its version; never guessed., type: string, nullable: true, pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,31}$' }
            ready: { type: boolean, description: False while the machine has a problem that stops it from running workloads }
        problems:
          description: >
            Things on the machine that stop it from running workloads, each with the way to fix it. Empty or missing means ready.
            The Root shows them and places nothing on a machine that has any.
          type: array
          maxItems: 20
          items:
            type: object
            required: [code, message, fix]
            additionalProperties: false
            properties:
              code: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
              message: { type: string, minLength: 1, maxLength: 300 }
              fix: { type: string, maxLength: 500 }
    ReportedVersion:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,31}$'
    Workload:
      type: object
      required: [id, name, kind, state, cpu, ram_mb, disk_gb, gpu_mode, bundle_version]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        kind: { type: string, enum: [vm, container] }
        state: { type: string, enum: [provisioning, running, stopped, failed, deleting] }
        cpu: { type: integer, minimum: 1 }
        ram_mb: { type: integer, minimum: 1 }
        disk_gb: { type: integer, minimum: 1 }
        gpu_mode: { type: string, enum: [none, container, passthrough] }
        address: { type: string, nullable: true }
        bundle_version: { type: string, nullable: true }
    WorkloadList:
      type: object
      required: [workloads]
      additionalProperties: false
      properties:
        workloads:
          type: array
          items: { $ref: '#/components/schemas/Workload' }
    WorkloadCreate:
      type: object
      required: [command_id, name, kind, cpu, ram_mb, disk_gb]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        kind: { type: string, enum: [vm, container] }
        cpu: { type: integer, minimum: 1, maximum: 64 }
        ram_mb: { type: integer, minimum: 512, maximum: 1048576 }
        disk_gb: { type: integer, minimum: 1, maximum: 100000 }
        gpu_mode: { type: string, enum: [none, container, passthrough], default: none }
        image: { type: string, pattern: '^[a-z0-9][a-z0-9._:/-]{0,127}$' }
    BundleInstall:
      type: object
      required: [command_id, version, sha256]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        workload_id: { $ref: '#/components/schemas/Id' }
    BundleUninstall:
      type: object
      required: [command_id]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        workload_id: { $ref: '#/components/schemas/Id' }
    CommandAccepted:
      type: object
      required: [command_id, state]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        state: { type: string, enum: [queued, running, succeeded, failed] }
    Command:
      type: object
      required: [command_id, type, state]
      additionalProperties: false
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [create, start, stop, delete, bundle_install, bundle_uninstall] }
        state: { type: string, enum: [queued, running, succeeded, failed] }
        workload_id: { $ref: '#/components/schemas/Id' }
        result:
          type: object
          nullable: true
          additionalProperties: true
    EnrollRequest:
      type: object
      required: [enrollment_token, name]
      additionalProperties: false
      properties:
        enrollment_token: { type: string, minLength: 16, maxLength: 256 }
        name: { $ref: '#/components/schemas/Name' }
    EnrollResponse:
      type: object
      required: [machine_token, command_token, heartbeat_seconds]
      additionalProperties: false
      properties:
        machine_token: { type: string, minLength: 32, description: the Agent shows this to the Root (heartbeats) }
        command_token: { type: string, minLength: 32, description: the Root shows this to the Agent (commands) }
        heartbeat_seconds: { type: integer, minimum: 1 }
    Heartbeat:
      type: object
      required: [facts, workloads]
      additionalProperties: false
      properties:
        facts: { $ref: '#/components/schemas/Facts' }
        workloads:
          type: array
          items: { $ref: '#/components/schemas/Workload' }
        bundle_version: { type: string, nullable: true }
