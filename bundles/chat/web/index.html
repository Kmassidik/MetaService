<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Ruvio</title>
    <link rel="icon" href="/ruvio-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/chat.css" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <span class="pill"><img class="mark" src="/ruvio-mark.svg" alt="" width="22" height="22" /><span class="name">Ruvio</span></span>
        <span id="state" class="state" role="status"></span>
      </header>
      <main id="scroll" class="scroll">
        <section id="empty" class="empty">
          <img class="mark big" src="/ruvio-mark.svg" alt="" width="64" height="64" />
          <h1>Hi, I'm Ruvio</h1>
          <p>Ask me anything. I run on this machine and answer through the AI your control panel gives me.</p>
        </section>
        <ol id="log" class="log" aria-live="polite"></ol>
      </main>
      <footer class="dock">
        <form id="form" class="composer" autocomplete="off">
          <textarea id="input" rows="1" maxlength="4000" placeholder="Message Ruvio" aria-label="Message" required></textarea>
          <button id="send" class="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
          </button>
        </form>
      </footer>
    </div>
    <script src="/chat.js"></script>
  </body>
</html>
